<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"><style>text{font-family:Arial,'Noto Sans Thai',sans-serif;fill:#263238}.t{font-size:20px}.s{font-size:16px;fill:#63727a}.h{font-size:25px;font-weight:700;fill:#fff}.c{font-size:15px;font-weight:700;fill:#7a0019}.g{stroke:#d7cad7;stroke-width:1.2}</style><rect width="1000" height="800" fill="#fcf9fc"/><text x="70" y="74" font-size="34" font-weight="700">02 · Users</text><text x="70" y="110" class="s">ตารางบัญชีผู้ดูแลระบบ</text><rect x="70" y="155" width="860" height="530" rx="14" fill="#fff" stroke="#d3a8cf" stroke-width="2"/><rect x="70" y="155" width="860" height="66" rx="14" fill="#94528e"/><rect x="70" y="205" width="860" height="16" fill="#94528e"/><text class="h" x="102" y="197">users</text><text x="102" y="255" class="s">FIELD</text><text x="430" y="255" class="s">DATA TYPE</text><text x="680" y="255" class="s">CONSTRAINT / DESCRIPTION</text><path class="g" d="M70 274H930M390 221V685M640 221V685M70 332H930M70 390H930M70 448H930M70 506H930M70 564H930M70 622H930"/><text class="t c" x="102" y="311">id</text><text class="t" x="430" y="311">INT</text><text class="s" x="680" y="311">Primary Key · Auto Increment</text><text class="t c" x="102" y="369">username</text><text class="t" x="430" y="369">VARCHAR(255)</text><text class="s" x="680" y="369">Unique · ชื่อเข้าสู่ระบบ</text><text class="t" x="102" y="427">password</text><text class="t" x="430" y="427">VARCHAR(255)</text><text class="s" x="680" y="427">รหัสผ่านที่เข้ารหัส · Required</text><text class="t" x="102" y="485">first_name</text><text class="t" x="430" y="485">VARCHAR(100)</text><text class="s" x="680" y="485">ชื่อจริง</text><text class="t" x="102" y="543">last_name</text><text class="t" x="430" y="543">VARCHAR(100)</text><text class="s" x="680" y="543">นามสกุล</text><text class="t" x="102" y="601">saka_path</text><text class="t" x="430" y="601">VARCHAR(50)</text><text class="s" x="680" y="601">สิทธิ์ดูข้อมูลตามสาขา</text><text class="t" x="102" y="659">can_edit</text><text class="t" x="430" y="659">TINYINT(1)</text><text class="s" x="680" y="659">1 แก้ไขได้ · 0 ดูได้อย่างเดียว</text><rect x="70" y="720" width="860" height="42" rx="9" fill="#f5ebf4"/><text x="92" y="747" class="s">ความสัมพันธ์: ผู้ดูแลใช้จัดการข้อมูลในระบบ แต่ฐานข้อมูลยังไม่ได้ผูก Foreign Key</text></svg>
