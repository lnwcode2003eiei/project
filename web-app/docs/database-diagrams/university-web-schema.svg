<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020">
  <style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:27px;font-weight:700;fill:#fff}.field{font-size:17px}.type{font-size:16px;fill:#555}.key{font-size:14px;fill:#8b0020;font-weight:700}.box{fill:#fff;stroke:#9ca3af;stroke-width:1.4}.line{stroke:#b4b4b4;stroke-width:1}</style>
  <rect width="1400" height="1020" fill="#fff"/>
  <text x="45" y="55" font-size="31" font-weight="700">university_web — Database Schema</text>
  <!-- visitors -->
  <g transform="translate(45 95)"><rect class="box" width="390" height="225"/><rect width="390" height="43" fill="#7a0019"/><text class="title" x="16" y="29">visitors</text><path class="line" d="M0 43H390M150 43V225M292 43V225M0 88H390M0 133H390M0 178H390"/><text class="field key" x="14" y="71">id</text><text class="type" x="164" y="71">INT</text><text class="key" x="304" y="71">PK, AI</text><text class="field" x="14" y="116">name</text><text class="type" x="164" y="116">VARCHAR(255)</text><text class="field" x="14" y="161">status</text><text class="type" x="164" y="161">VARCHAR(100)</text><text class="field" x="14" y="206">created_at</text><text class="type" x="164" y="206">TIMESTAMP</text></g>
  <!-- users -->
  <g transform="translate(505 95)"><rect class="box" width="390" height="360"/><rect width="390" height="43" fill="#7a0019"/><text class="title" x="16" y="29">users</text><path class="line" d="M0 43H390M150 43V360M292 43V360M0 88H390M0 133H390M0 178H390M0 223H390M0 268H390M0 313H390"/><text class="field key" x="14" y="71">id</text><text class="type" x="164" y="71">INT</text><text class="key" x="304" y="71">PK, AI</text><text class="field" x="14" y="116">username</text><text class="type" x="164" y="116">VARCHAR(255)</text><text class="key" x="304" y="116">UNIQUE</text><text class="field" x="14" y="161">password</text><text class="type" x="164" y="161">VARCHAR(255)</text><text class="field" x="14" y="206">first_name</text><text class="type" x="164" y="206">VARCHAR(100)</text><text class="field" x="14" y="251">last_name</text><text class="type" x="164" y="251">VARCHAR(100)</text><text class="field" x="14" y="296">saka_path</text><text class="type" x="164" y="296">VARCHAR(50)</text><text class="field" x="14" y="341">can_edit</text><text class="type" x="164" y="341">TINYINT(1)</text></g>
  <!-- news -->
  <g transform="translate(965 95)"><rect class="box" width="390" height="270"/><rect width="390" height="43" fill="#7a0019"/><text class="title" x="16" y="29">news</text><path class="line" d="M0 43H390M150 43V270M292 43V270M0 88H390M0 133H390M0 178H390M0 223H390"/><text class="field key" x="14" y="71">id</text><text class="type" x="164" y="71">INT</text><text class="key" x="304" y="71">PK, AI</text><text class="field" x="14" y="116">title</text><text class="type" x="164" y="116">VARCHAR(255)</text><text class="field" x="14" y="161">category</text><text class="type" x="164" y="161">VARCHAR(100)</text><text class="field" x="14" y="206">description</text><text class="type" x="164" y="206">TEXT</text><text class="field" x="14" y="251">image, created_at</text><text class="type" x="164" y="251">VARCHAR, TIMESTAMP</text></g>
  <!-- applications -->
  <g transform="translate(45 535)"><rect class="box" width="500" height="315"/><rect width="500" height="43" fill="#7a0019"/><text class="title" x="16" y="29">applications</text><path class="line" d="M0 43H500M190 43V315M375 43V315M0 88H500M0 133H500M0 178H500M0 223H500M0 268H500"/><text class="field key" x="14" y="71">id</text><text class="type" x="205" y="71">INT</text><text class="key" x="392" y="71">PK, AI</text><text class="field" x="14" y="116">major_name</text><text class="type" x="205" y="116">VARCHAR(255)</text><text class="field" x="14" y="161">fullname</text><text class="type" x="205" y="161">VARCHAR(255)</text><text class="field" x="14" y="206">old_school</text><text class="type" x="205" y="206">VARCHAR(255)</text><text class="field" x="14" y="251">education</text><text class="type" x="205" y="251">VARCHAR(100)</text><text class="field" x="14" y="296">created_at</text><text class="type" x="205" y="296">TIMESTAMP</text></g>
  <!-- course info -->
  <g transform="translate(650 535)"><rect class="box" width="705" height="430"/><rect width="705" height="43" fill="#7a0019"/><text class="title" x="16" y="29">course_info</text><path class="line" d="M0 43H705M300 43V430M525 43V430M0 86H705M0 129H705M0 172H705M0 215H705M0 258H705M0 301H705M0 344H705M0 387H705"/><text class="field key" x="14" y="71">id</text><text class="type" x="314" y="71">INT</text><text class="key" x="540" y="71">PK, AI</text><text class="field" x="14" y="114">saka_path</text><text class="type" x="314" y="114">VARCHAR(50)</text><text class="key" x="540" y="114">UNIQUE</text><text class="field" x="14" y="157">faculty_name, title</text><text class="type" x="314" y="157">VARCHAR(255)</text><text class="field" x="14" y="200">english_title</text><text class="type" x="314" y="200">VARCHAR(255)</text><text class="field" x="14" y="243">hero_description</text><text class="type" x="314" y="243">TEXT</text><text class="field" x="14" y="286">about_title</text><text class="type" x="314" y="286">VARCHAR(255)</text><text class="field" x="14" y="329">about_description_1, _2</text><text class="type" x="314" y="329">TEXT</text><text class="field" x="14" y="372">image</text><text class="type" x="314" y="372">VARCHAR(500)</text><text class="field" x="14" y="415">highlights, curriculum, skills, careers</text><text class="type" x="314" y="415">JSON</text></g>
  <text x="45" y="990" font-size="15" fill="#666">PK = Primary Key · AI = Auto Increment · ตารางในฐานข้อมูลปัจจุบันไม่มี Foreign Key เชื่อมกัน</text>
</svg>
