
services:
  mysql:
    image: mysql:8.0
    container_name: webapp-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-university_web}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webapp-phpmyadmin
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1

    ports:
      - "127.0.0.1:8080:80"


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: webapp-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "5000"

    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-university_web}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}

    volumes:
      # เก็บรูปที่ Admin อัปโหลด
      # ฝั่งเครื่องเรา: ./uploads
      # ฝั่ง container: /app/uploads
      - ./uploads:/app/uploads


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /

    container_name: webapp-frontend
    restart: unless-stopped

    depends_on:
      - backend

    expose:
      - "80"


  caddy:
    image: caddy:2-alpine
    container_name: webapp-caddy
    restart: unless-stopped

    depends_on:
      - frontend

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config


  n8n:
    image: n8nio/n8n:latest
    container_name: webapp-n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

    volumes:
      - n8n_data:/home/node/.n8n


volumes:
  mysql_data:
  n8n_data:
  caddy_data:
  caddy_config:

